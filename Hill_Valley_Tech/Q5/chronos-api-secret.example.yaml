# Exemplo — Secret criado fora do Git (Sealed Secrets / External Secrets / vault)
# Nunca commitar valores reais. Rotacionar credenciais expostas no manifest legado.
apiVersion: v1
kind: Secret
metadata:
  name: chronos-api-secrets
  namespace: production
  labels:
    app.kubernetes.io/name: chronos-api
type: Opaque
stringData:
  DB_PASSWORD: "<substituir-via-pipeline>"
  JWT_SECRET: "<substituir-via-pipeline>"
